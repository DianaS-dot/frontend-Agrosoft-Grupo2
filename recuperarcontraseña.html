<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="splitcontenedor">
        <div class="portada1">
            <img src="images.png" alt="logo" class="logo">
            <h1 class="titulo">Agrosoft</h1>
            <p class="subtitulo">Gestión Inteligente de Cultivos </p>
        </div>
        
        <div class="portada2">
            <div class="formulario">
                <h2>Recuperar Contraseña</h2>
                <p>ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña</p>
                
                <label for="email">Email</label>
                <div class="input-icon">
                    <i class="bi bi-envelope"></i>
                    <input type="text" id="email" placeholder="tu-email@agrosoft.com">
                </div>
                <button type="submit">Enviar enlace</button>
                <p class="continuarcon">o continuar con</p>
                
                <div class="botonesAyG">
                    <button><i class="bi bi-apple"></i>Continuar con Apple</button>
                    <button><i class="bi bi-google"></i>Continuar con Google</button>
                </div>
                
                <p class="cuentaregis">¿Recordaste tu contraseña? <a href="index.html">Iniciar Sesión</a></p>
            </div>
        </div>
    </div>
</body>
</html>
