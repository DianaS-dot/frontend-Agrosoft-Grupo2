<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Agrosoft</title>

    <link rel="stylesheet" href="../estilos/registrarse.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="contenedor">


        <div class="panel-logo">
            <a href="index.html" class="volver">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="logo">
                <i class="fa-solid fa-leaf"></i>
            </div>

            <h1>Agrosoft</h1>

            <p>Únete a nuestra comunidad agrícola</p>

        </div>


        <div class="panel-formulario">
            <h2>Crear Cuenta</h2>
            <span>
                Completa tus datos para comenzar
            </span>

            <form>
                <label>Nombre completo</label>
                <div class="input-box">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" placeholder="Juan Pérez">
                </div>

                <label>Correo electrónico</label>

                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="tu-email@agrosoft.com">
                </div>

                <label>Rol</label>

                <div class="input-box">
                    <i class="fa-regular fa-id-badge"></i>

                    <select>
                        <option selected disabled>
                            Selecciona tu rol
                        </option>

                        <option>Aprendiz</option>
                        <option>Instructor</option>
                        <option>Agricultor</option>
                    </select>
                </div>

                <label>Contraseña</label>

                <div class="input-box">
                    <input type="password" placeholder="Mínimo 8 caracteres">
                    <i class="fa-regular fa-eye"></i>
                </div>

                <label>Confirmar contraseña</label>

                <div class="input-box">
                    <input type="password" placeholder="Repite tu contraseña">
                    <i class="fa-regular fa-eye"></i>
                </div>

                <button type="submit" class="btn">
                    Crear Cuenta
                </button>

            </form>

            <div class="separador">
                o regístrate con
            </div>

            <div class="sociales">

                <button>
                    <i class="fa-brands fa-apple"></i>
                    Apple
                </button>

                <button>
                    <i class="fa-brands fa-google"></i>
                    Google
                </button>
            </div>

            <p class="login">
                ¿Ya tienes cuenta?
                <a href="index.html">Iniciar Sesión</a>
            </p>
        </div>
    </div>
</body>
</html>
