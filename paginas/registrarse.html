<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Agrosoft</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/registrarse.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="splitcontenedor">


        <div class="portada1">
            
            <div class="logo">
                <i class="fa-solid fa-leaf"></i>
            </div>

            <h1 class="titulo">Agrosoft</h1>

            <p class="subtitulo">Únete a nuestra comunidad agrícola</p>

        </div>


        <div class="portada2">
            <form class="formulario">
                <p class="text1">Completa tus datos para comenzar</p>

                <label>Nombre completo</label>
                <div class="input-icon">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" placeholder="Juan Pérez">
                </div>

                <label>Correo electrónico</label>

                <div class="input-icon">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" placeholder="tu-email@agrosoft.com">
                </div>

                <label>Rol</label>

                <div class="input-icon">
                    <i class="fa-regular fa-id-badge"></i>

                    <select>
                        <option selected disabled>
                            Selecciona tu rol
                        </option>

                        <option>Aprendiz</option>
                        <option>Instructor</option>
                        <option>Agricultor</option>
                    </select>
                </div>

                <label>Contraseña</label>

                <div class="input-icon">
                    <input type="password" placeholder="Mínimo 8 caracteres">
                    <i class="fa-regular fa-eye"></i>
                </div>

                <label>Confirmar contraseña</label>

                <div class="input-icon">
                    <input type="password" placeholder="Repite tu contraseña">
                    <i class="fa-regular fa-eye"></i>
                </div>

                <button type="submit">
                    Crear Cuenta
                </button>

                <p class="continuarcon">o regístrate con</p>

                <div class="botonesAyG">

                    <button type="button">
                        <i class="fa-brands fa-apple"></i>
                        Apple
                    </button>

                    <button type="button">
                        <i class="fa-brands fa-google"></i>
                        Google
                    </button>
                </div>

                <p class="cuentaregis">
                    ¿Ya tienes cuenta?
                    <a href="index.html">Iniciar Sesión</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
