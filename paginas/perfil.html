<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - Agrosoft</title>
    <link rel="stylesheet" href="../estilos/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="perfil-body">

    <div class="contenedor-perfil">
        <a href="dasboard.html" class="link-volver"><i class="fa-solid fa-arrow-left"></i> Volver</a>

        <div class="tarjeta-perfil">
            <div class="perfil-sidebar">
                <div class="foto-usuario">
                    <img src="../recursos/imagenes/perfil-placeholder.jpg" alt="Foto">
                    <button class="btn-cambiar-foto"><i class="fa-solid fa-camera"></i></button>
                </div>
                <h2>Juan Pérez</h2>
                <p class="rol">Aprendiz Agrícola</p>
                
                <div class="menu-perfil">
                    <a href="#" class="active"><i class="fa-solid fa-user"></i> Datos Personales</a>
                    <a href="#"><i class="fa-solid fa-shield-halved"></i> Seguridad</a>
                    <a href="#"><i class="fa-solid fa-bell"></i> Notificaciones</a>
                </div>
            </div>

            <div class="perfil-main">
                <div class="stats-grid">
                    <div class="stat-card"><span>3</span> Fincas</div>
                    <div class="stat-card"><span>12</span> Cultivos</div>
                    <div class="stat-card"><span>5</span> Incidencias</div>
                </div>

                <h3>Información Personal</h3>
                <form class="form-perfil">
                    <div class="input-group">
                        <label>Nombre Completo</label>
                        <input type="text" value="Juan Pérez">
                    </div>
                    <div class="input-group">
                        <label>Correo Electrónico</label>
                        <input type="email" value="juan.perez@agrosoft.com">
                    </div>
                    <div class="input-group">
                        <label>Teléfono</label>
                        <input type="tel" value="+57 300 000 0000">
                    </div>
                    <button type="submit" class="btn-main">Guardar Cambios</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
