<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Insumo</title>

    <link rel="stylesheet" href="../estilos/eliminarinsumo.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="fondo">

        <div class="insumo">

            <div class="encabezado">

                <h2>Eliminar Insumo</h2>
                <a href="stock.html" class="boton-cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </a>
            </div>

            <div class="contenido-eliminar">

                <div class="icono-advertencia">
                    <i class="fa-solid fa-trash"></i>
                </div>

                <h3>¿Deseas eliminar este insumo?</h3>

                <p>
                    Esta acción eliminará permanentemente el insumo
                    <strong>Fertilizante NPK</strong>.
                </p>

                <div class="datos-insumo">

                    <div class="dato">
                        <span>Tipo</span>
                        <strong>Fertilizante</strong>
                    </div>

                    <div class="dato">
                        <span>Cantidad</span>
                        <strong>50 kg</strong>
                    </div>
                </div>

                <div class="botones">

                    <a href="stock.html" class="boton-cancelar">
                        Cancelar
                    </a>

                    <button class="boton-eliminar">
                        Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
