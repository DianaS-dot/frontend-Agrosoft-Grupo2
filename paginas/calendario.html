<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario — Agrosoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/calendario.css">
</head>
<body>

    <header>
        <div class="marca">
            <h1>Agrosoft</h1>
            <p>Gestión de Usuarios</p>
        </div>
        <button class="btn-salir">Cerrar Sesión</button>
    </header>

    <div class="contenedor">
    

        <main>
            <article class="tarjeta-calendario">

                <header class="cabecera-calendario">
                    <button onclick="history.back()" class="btn-anterior">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    </button>
                    <h1>Calendario de Actividades</h1>
                    <button class="btn-agregar" aria-label="Agregar actividad" onclick="abrirModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    </button>
                </header>

                <div class="cuerpo-calendario">

                    <div class="campo-fecha">
                        <input type="date" id="fechaSeleccionada" value="2026-05-11" />
                    </div>

                    <section class="lista-actividades">
                        <h2>Actividades programadas</h2>

                        <div class="actividad">
                            <button class="btn-completar" aria-label="Marcar como completada"></button>
                            <div class="info-actividad">
                                <h3>Riego de maíz</h3>
                                <div class="meta-actividad"><span>20/4/2026</span><span>•</span><span>08:00</span></div>
                                <span class="etiqueta etiqueta-riego">riego</span>
                            </div>
                        </div>

                        <div class="actividad">
                            <button class="btn-completar" aria-label="Marcar como completada"></button>
                            <div class="info-actividad">
                                <h3>Fertilización tomate</h3>
                                <div class="meta-actividad"><span>21/4/2026</span><span>•</span><span>10:00</span></div>
                                <span class="etiqueta etiqueta-fertilizacion">fertilización</span>
                            </div>
                        </div>

                        <div class="actividad">
                            <button class="btn-completar" aria-label="Marcar como completada"></button>
                            <div class="info-actividad">
                                <h3>Control de plagas</h3>
                                <div class="meta-actividad"><span>22/4/2026</span><span>•</span><span>14:00</span></div>
                                <span class="etiqueta etiqueta-control">control</span>
                            </div>
                        </div>

                        <div class="actividad">
                            <button class="btn-completar" aria-label="Marcar como completada"></button>
                            <div class="info-actividad">
                                <h3>Cosecha de café</h3>
                                <div class="meta-actividad"><span>24/4/2026</span><span>•</span><span>06:00</span></div>
                                <span class="etiqueta etiqueta-cosecha">cosecha</span>
                            </div>
                        </div>

                    </section>
                </div>
            </article>
        </main>
    </div>

    <!-- Modal nueva actividad -->
    <div id="modal-actividad" class="fondo-modal" hidden>
        <div class="modal">
            <header class="modal-cabecera">
                <h2>Nueva actividad</h2>
                <button class="btn-cerrar-modal" onclick="cerrarModal()">✕</button>
            </header>
            <form id="formulario-actividad" onsubmit="agregarActividad(event)">
                <div class="campo">
                    <label for="titulo-actividad">Título *</label>
                    <input type="text" id="titulo-actividad" placeholder="Ej. Riego de maíz" required />
                </div>
                <div class="dos-columnas">
                    <div class="campo">
                        <label for="fecha-actividad">Fecha *</label>
                        <input type="date" id="fecha-actividad" required />
                    </div>
                    <div class="campo">
                        <label for="hora-actividad">Hora *</label>
                        <input type="time" id="hora-actividad" required />
                    </div>
                </div>
                <div class="campo">
                    <label for="tipo-actividad">Tipo *</label>
                    <select id="tipo-actividad" required>
                        <option value="">Seleccionar</option>
                        <option value="riego">Riego</option>
                        <option value="fertilizacion">Fertilización</option>
                        <option value="control">Control de plagas</option>
                        <option value="cosecha">Cosecha</option>
                        <option value="siembra">Siembra</option>
                        <option value="otro">Otro</option>
                    </select>
                </div>
                <button type="submit">Agregar actividad</button>
            </form>
        </div>
    </div>

    <!-- Botón flotante móvil -->
    <button class="btn-flotante" aria-label="Agregar actividad" onclick="abrirModal()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>

    <script src="../recursos/javascrip/calendario.js"></script>
</body>
</html>
