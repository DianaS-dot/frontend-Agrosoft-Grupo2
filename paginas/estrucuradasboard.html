<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout — Agrosoft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos/estilosestructuradash.css">
</head>

<body>

  
    <header>
        <div class="cabecera">

            <!-- Botón hamburguesa (solo visible en móvil) -->
            <button id="btn-menu" class="btn-menu-movil" aria-label="Abrir menú">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="6"  x2="21" y2="6"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>

            <!-- Logo -->
            <div class="logocaja">
                <div class="logo-img">
                    <img src="../recursos/imagenes/logo (1).png" alt="Agrosoft">
                </div>
                <div class="textologo">
                    <h1 class="nombresistema">Agrosoft</h1>
                    <p class="descripsistema">Sistema de gestión agrícola</p>
                </div>
            </div>

            <!-- Opciones derecha -->
            <div class="opcionescab">
                <div class="fechahoy">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="18" rx="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8"  y1="2" x2="8"  y2="6"/>
                        <line x1="3"  y1="10" x2="21" y2="10"/>
                    </svg>
                    <span id="fecha-actual"></span>
                </div>

                <div class="campanita" role="button" aria-label="Notificaciones">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    <span class="numerito">3</span>
                </div>
            </div>

        </div>
    </header>

    <!-- Overlay para móvil -->
    <div class="overlay-menu" id="overlay-menu"></div>

    <!-- ══════════════════════════════════
         PANTALLA PRINCIPAL
    ══════════════════════════════════ -->
    <div class="pantalla">

        <!-- ────────────────────────────
             BARRA LATERAL
        ──────────────────────────── -->
        <nav>
            <div class="barralateral">

                <!-- Perfil -->
                <div class="cajaperfil">
                    <div class="fotousuario"></div>
                    <div class="datosusuario">
                        <span class="nombrenusuario">Admin</span>
                        <span class="cargousuario">Administrador</span>
                    </div>
                </div>

                <div class="lineita"></div>
                <span class="grupomenu">Menú principal</span>

                <a href="dasboard.html" class="opcionmenu seleccionado">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3"  y="3"  width="7" height="7" rx="1"/>
                        <rect x="14" y="3"  width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                        <rect x="3"  y="14" width="7" height="7" rx="1"/>
                    </svg>
                    <span>Dashboard</span>
                </a>

                <div class="lineita"></div>
                <span class="grupomenu">Gestión</span>

                <a href="usuarios.html" class="opcionmenu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    <span>Usuarios</span>
                </a>

                <a href="nuevousuario.html" class="opcionmenu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <line x1="19" y1="8"  x2="19" y2="14"/>
                        <line x1="22" y1="11" x2="16" y2="11"/>
                    </svg>
                    <span>Nuevo usuario</span>
                </a>

                <a href="roles.html" class="opcionmenu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    <span>Roles</span>
                </a>

                <!-- Espaciador empuja "Cerrar sesión" al fondo -->
                <div class="espaciador"></div>

                <a href="index.html" class="opcionmenu salir">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    <span>Cerrar sesión</span>
                </a>

            </div>
        </nav>

        <!-- ────────────────────────────
             CONTENIDO (vacío por ahora)
        ──────────────────────────── -->
        <main>
            <!-- Aquí va el contenido de cada página -->
        </main>

    </div>

    <script>
        /* Fecha dinámica */
        const fechaEl = document.getElementById('fecha-actual');
        const hoy = new Date();
        fechaEl.textContent = hoy.toLocaleDateString('es-ES', {
            weekday: 'long', day: 'numeric', month: 'long'
        });

        /* Toggle sidebar en móvil */
        const btnMenu = document.getElementById('btn-menu');
        const nav     = document.getElementById('nav-sidebar');
        const overlay = document.getElementById('overlay-menu');

        function toggleMenu() {
            nav.classList.toggle('activo');
            overlay.classList.toggle('activo');
        }

        btnMenu.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>

</body>
</html>
