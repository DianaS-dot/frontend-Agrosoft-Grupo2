<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Cultivo</title>
    <link rel="stylesheet" href="../estilos/eliminarcultivo.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="fondo">

        <div class="insumo">
            <div class="contenido-eliminar">
                <div class="icono-advertencia">
                    <i class="fa-solid fa-trash"></i>
                </div>

                <h3>¿Deseas eliminar este cultivo?</h3>

                <p>
                    Esta acción eliminará el cultivo
                    <strong>Maíz Amarillo</strong>.
                </p>

                <div class="datos-insumo">
                    <div class="dato">
                        <span>Tipo</span>
                        <strong>Cultivo</strong>
                    </div>

                    <div class="dato">
                        <span>Área</span>
                        <strong>10 hectáreas</strong>
                    </div>

                </div>

            
                <div class="botones">
                    <a href="dashboard.html" class="boton-cancelar">
                        Cancelar
                    </a>

                    <button class="boton-eliminar">
                        Eliminar
                    </button>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
