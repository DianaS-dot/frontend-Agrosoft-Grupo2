<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Agrosoft</title>

    <link rel="stylesheet" href="../estilos/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="contenedor">


        <div class="panel-logo">
            <div class="logo">
                <i class="fa-solid fa-leaf"></i>
            </div>

            <h1>Agrosoft</h1>
            <p>Gestión Inteligente de Cultivos</p>
        </div>

        <div class="panel-formulario">
            <h2>Iniciar Sesión</h2>
            <span>
                Ingresa tus credenciales para continuar
            </span>

            <form action="dasboard.html" method="get">
                <label>Email</label>
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input
                        type="email"
                        name="email"
                        placeholder="tu-email@agrosoft.com"
                        required>
                </div>

                <label>Contraseña</label>
                <div class="input-box">
                    <input
                        type="password"
                        name="password"
                        placeholder="••••••••"
                        required>
                    <i class="fa-regular fa-eye"></i>
                </div>

                <div class="opciones">

                    <a href="recuperarcontrasena.html">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <button
                    type="submit"
                    class="btn">

                    Iniciar Sesión

                </button>

            </form>


            <div class="separador">
                o continuar con
            </div>

            <div class="sociales">

                <button type="button">
                    <i class="fa-brands fa-apple"></i>
                    Apple
                </button>

                <button type="button">
                    <i class="fa-brands fa-google"></i>
                    Google
                </button>

            </div>


            <p class="login">
                ¿No tienes cuenta?
                <a href="registrarse.html">
                    Registrarse
                </a>
            </p>
        </div>
    </div>
</body>
</html>
