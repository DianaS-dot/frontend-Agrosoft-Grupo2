<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Cultivo — Agrosoft</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/nuevocultivo.css">
</head>
<body>

    <div class="contenedor-formulario">
        <div class="tarjeta-form">
            
            <div class="encabezado-verde">
                <button class="btn-volver" onclick="window.history.back()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                </button>
                <h1 class="titulo-pantalla">Nuevo Cultivo</h1>
            </div>

            <div class="cuerpo-form">
                <div class="caja-foto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    <span>Toca para agregar foto</span>
                </div>

                <form>
                    <h3 class="seccion-label">Información básica</h3>
                    <label class="label-input">Nombre del cultivo *</label>
                    <input type="text" class="input-full" placeholder="">

                    <div class="fila-input">
                        <div class="grupo-input">
                            <label class="label-input">Tipo de cultivo *</label>
                            <select class="input-full"><option>Seleccionar</option></select>
                        </div>
                        <div class="grupo-input">
                            <label class="label-input">Variedad *</label>
                            <input type="text" class="input-full">
                        </div>
                    </div>

                    <h3 class="seccion-label">Fechas</h3>
                    <div class="fila-input">
                        <div class="grupo-input">
                            <label class="label-input">Cosecha estimada</label>
                            <input type="date" class="input-full">
                        </div>
                        <div class="grupo-input">
                            <label class="label-input">Fecha de siembra</label>
                            <input type="date" class="input-full">
                        </div>
                    </div>

                    <h3 class="seccion-label">Área y densidad</h3>
                    <div class="fila-input">
                        <div class="grupo-input">
                            <label class="label-input">Área *</label>
                            <div class="input-con-select">
                                <input type="number" class="input-full">
                                <select><option>Hectáreas</option></select>
                            </div>
                        </div>
                        <div class="grupo-input">
                            <label class="label-input">Densidad *</label>
                            <div class="input-con-select">
                                <input type="number" class="input-full">
                                <select><option>plantas/ha</option></select>
                            </div>
                        </div>
                    </div>

                    <h3 class="seccion-label">Condiciones de cultivo</h3>
                    <label class="label-input">Tipo de suelo *</label>
                    <select class="input-full"><option>Seleccionar</option></select>

                    <label class="label-input">Tipo de riego *</label>
                    <select class="input-full"><option>Seleccionar</option></select>

                    <h3 class="seccion-label">Notas adicionales</h3>
                    <textarea class="input-full" rows="4" placeholder="Observaciones, recomendaciones..."></textarea>

                    <button type="submit" class="boton-guardar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        Guardar cultivo
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
