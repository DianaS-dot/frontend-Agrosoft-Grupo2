<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/estilos/recuperarcontraseña.css">
</head>
<body>
    <div class="splitcontenedor">
        <div class="portada1">
            <div class="logo">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <h1 class="titulo">Agrosoft</h1>
            <p class="subtitulo">Gestión Inteligente de Cultivos</p>
        </div>

        <div class="portada2">
            <form class="formulario formulario-recuperar">
                <h2>Recuperar Contraseña</h2>
                <p class="text1">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña</p>

                <label for="email">Email</label>
                <div class="input-icon">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="tu-email@agrosoft.com" required>
                </div>

                <button type="submit">Enviar enlace</button>
                <p class="continuarcon">o continuar con</p>

                <div class="botonesAyG">
                    <button type="button"><i class="bi bi-apple"></i>Apple</button>
                    <button type="button"><i class="bi bi-google"></i>Google</button>
                </div>

                <p class="cuentaregis">¿Recordaste tu contraseña? <a href="index.html">Iniciar Sesión</a></p>
            </form>
        </div>
    </div>
</body>
</html>
