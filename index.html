<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="/estilos/style.css">
</head>
<body>
    <div class="splitcontenedor">
        <div class="portada1">
            <img src="images.png" alt="logo" class="logo">
            <h1 class="titulo">Agrosoft</h1>
            <p class="subtitulo">Gestión Inteligente de Cultivos </p>
        </div>
        <div class="portada2">
            <div class="formulario">
            <h2>Iniciar Sesión</h2>
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="tu-email@agrosoft.com">
            <label for="constraseña">Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
            <p class="olvidopass">olvidaste tu contraseña</p>
            <button type="submit">Iniciar Sesión</button>
            <p class="continuarcon">o continuar con</p>
            <div class="botonesAyG">
                <button>Continuar con Apple</button>
                <button>Continuar con Google</button>
            </div>
            <p class="cuentaregis">¿No tienes cuenta? <a href="#">Registrarse</a></p>
        </div>
        </div>
    </div>

</body>
</html>
